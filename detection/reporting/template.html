<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* 한 단 보고서: 머리 → 한 장 요약(인쇄 첫 쪽) → 본문: 요약 → 판정 현황 → 기밀정보 → 개인정보 → 주요 사건 → 차단 뒤 재요청 → 사용자
   → 내용 경향 → 변경 → 운영 → 관측 범위 → 권고 → 참고(정의·기준).
   자바스크립트·외부 글꼴·외부 그림 없음(저장·인쇄해도 같게 나옴). 그래프는 render.py가 만든 인라인 SVG, 색은 아래 변수. */
:root {
  --bg: #f4f5f6; --paper: #fcfcfb; --ink: #12161b; --ink-2: #4b5360; --muted: #7d848e;
  --rule: #e2e4e7; --rule-strong: #c7cbd1; --accent: #5b47b0; --accent-wash: rgba(91, 71, 176, 0.07);
  --s1: #2a78d6;  /* 기밀 차단 */
  --s2: #eb6834;  /* 차단 */
  --s3: #1baf7a;  /* 마스킹 */
  --s0: #d3d6db;  /* 허용·이전 기간 - 뒤로 물린다 */
  --st-critical: #d03b3b; --st-serious: #ec835a; --st-warning: #fab219; --st-good: #0ca30c; --st-critical-text: #c02f2f;
  --on-s0: #12161b; --on-s1: #ffffff; --on-s2: #12161b; --on-s3: #12161b; --on-crit: #ffffff; --on-serious: #12161b;
  --sans: "IBM Plex Sans KR", system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans CJK KR", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f11; --paper: #17181a; --ink: #f2f3f4; --ink-2: #c3c7cd; --muted: #8b9199;
    --rule: #2a2c30; --rule-strong: #3a3d42; --accent: #a99af0; --accent-wash: rgba(169, 154, 240, 0.10);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s0: #44474d;
    --on-s0: #f2f3f4; --on-s1: #12161b; --st-critical-text: #ff8f8f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f11; --paper: #17181a; --ink: #f2f3f4; --ink-2: #c3c7cd; --muted: #8b9199;
  --rule: #2a2c30; --rule-strong: #3a3d42; --accent: #a99af0; --accent-wash: rgba(169, 154, 240, 0.10);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s0: #44474d;
  --on-s0: #f2f3f4; --on-s1: #12161b; --st-critical-text: #ff8f8f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.65;
  padding-inline: 16px; padding-block: 28px 64px; }
.doc { max-width: 980px; margin: 0 auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px;
  padding: clamp(18px, 4vw, 48px); }
h1, h2, h3 { text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: clamp(24px, 3.2vw, 32px); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 20px; font-weight: 700; }
h3 { font-size: 15.5px; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); }
figure { margin: 0; }
.mono { font-family: var(--mono); font-size: 0.92em; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0);
  clip-path: inset(50%); white-space: nowrap; border: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.head { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-bottom: 24px; border-bottom: 1px solid var(--rule-strong); }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px 24px; margin: 0; }
.meta div { display: grid; gap: 2px; min-width: 0; }
.meta dt { font-size: 12px; color: var(--muted); }
.meta dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.meta .sub { color: var(--muted); font-weight: 400; font-size: 13px; }
.toc { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.toc a { color: var(--ink-2); text-decoration: none; }
.toc a:hover { color: var(--accent); }
section { padding-top: 36px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; min-width: 0; }
.sec-head { display: grid; gap: 4px; }
section > *, .inc > * { min-width: 0; }
.brief { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.brief li { max-width: 76ch; overflow-wrap: anywhere; }
.brief .k { font-size: 12px; color: var(--muted); margin-right: 4px; }
.note { font-size: 13px; color: var(--ink-2); }
.facts { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--ink-2); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(136px, 1fr)); gap: 12px; }
.kpi { border: 1px solid var(--rule); border-radius: 4px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0; align-content: start; word-break: keep-all; }
.kpi .v { font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.15; font-variant-numeric: tabular-nums;
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
.kpi .v small { font-size: 14px; font-weight: 600; }
.kpi .l { font-size: 13px; color: var(--ink-2); }
.kpi .s { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: 1px; }
.chip { font-size: 12px; font-weight: 600; letter-spacing: 0; line-height: 1.4; padding: 0 6px; border-radius: 999px;
  border: 1px solid var(--rule-strong); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.up, .chip.down { color: var(--ink); }
.chip.na { font-weight: 500; color: var(--muted); }
.chart { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; min-width: 0; }
.chart-title { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; }
.chart-title .sub { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px 28px; }
.grid2 > * { min-width: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }
.legend i.kd, .legend i.kl { width: 16px; height: 0; border-radius: 0; background: none; border-top: 2px solid var(--c); }
.legend i.kd { border-top-style: dashed; }
/* 그래프 색 - 변수 하나가 조각·선·범례를 같이 정한다 */
:root { --k-block: var(--s2); --k-mask: var(--s3); --k-allow: var(--s0); --k-secret: var(--s1); --k-prev: var(--s0);
  --k-total: var(--ink-2); --k-crit: var(--st-critical); --k-serious: var(--st-serious); --k-low: var(--s0); --k-other: var(--rule-strong); }
.f-block, .s-block { --c: var(--k-block); } .f-mask, .s-mask { --c: var(--k-mask); } .f-allow, .s-allow { --c: var(--k-allow); }
.f-secret, .s-secret { --c: var(--k-secret); } .f-prev, .s-prev { --c: var(--k-prev); } .f-total, .s-total { --c: var(--k-total); }
.f-crit { --c: var(--k-crit); } .f-serious { --c: var(--k-serious); } .f-low { --c: var(--k-low); } .f-other { --c: var(--k-other); }
.legend i[class^="f-"] { background: var(--c); }
.svgbox { width: 100%; min-width: 0; }
.v-narrow { display: none; }
.ch { display: block; width: 100%; height: auto; overflow: visible; }
.v-wide .ch { max-width: 680px; }
.v-narrow .ch { max-width: 440px; }
.ch text { font-family: var(--sans); font-size: 12px; fill: var(--ink-2); }
.ch .tm { fill: var(--muted); }
.ch .tv { fill: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ch .t2 { fill: var(--accent); }
.ch .sm { font-size: 10.5px; }
.ch .in { font-size: 11px; font-weight: 600; }
.ch path[class^="f-"], .ch rect[class*="f-"], .ch circle[class*="f-"], .ch polygon[class*="f-"] { fill: var(--c); }
.ch .on-block { fill: var(--on-s2); } .ch .on-mask { fill: var(--on-s3); } .ch .on-allow { fill: var(--on-s0); }
.ch .on-secret { fill: var(--on-s1); } .ch .on-prev { fill: var(--on-s0); } .ch .on-crit { fill: var(--on-crit); }
.ch .on-serious { fill: var(--on-serious); } .ch .on-low { fill: var(--on-s0); } .ch .on-other { fill: var(--ink); }
.ch .on-total { fill: var(--paper); }
.ch .g-grid { stroke: var(--rule); stroke-width: 1; }
.ch .g-axis { stroke: var(--rule-strong); stroke-width: 1; }
.ch .ln { fill: none; stroke: var(--c); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch .pv { stroke-dasharray: 5 4; opacity: 0.6; }
.ch .mk { stroke: var(--paper); stroke-width: 2; }
.ch .hit { fill: transparent; }
.ch .hit:hover { fill: var(--accent-wash); }
details.table, .inc-all { font-size: 13px; }
details.table summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.tbl-wrap { overflow-x: auto; margin-top: 4px; max-width: 100%; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 13.5px; }
th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--rule); white-space: nowrap; vertical-align: top; }
th { font-weight: 600; color: var(--ink-2); font-size: 12px; }
td.num, th.num { text-align: right; }
td.empty { color: var(--muted); }
table.wrap td { white-space: normal; word-break: keep-all; overflow-wrap: break-word; }
tr:target { background: var(--accent-wash); }
.badge { font-size: 11px; border: 1px solid var(--s1); color: var(--s1); border-radius: 3px; padding: 0 4px; }
.incs { display: grid; gap: 12px; }
.inc { border: 1px solid var(--rule); border-left: 3px solid var(--s0); border-radius: 4px; padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.inc.g1 { border-left-color: var(--st-critical); }
.inc.g2 { border-left-color: var(--st-serious); }
.inc.g3 { border-left-color: var(--st-warning); }
.inc:target { background: var(--accent-wash); }
.inc-top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.inc-top .rank { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.inc-top .grade { font-size: 12px; font-weight: 600; border: 1px solid var(--rule-strong); border-radius: 999px; padding: 0 8px; }
.inc-top .meta-i { font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.steps { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.act-wrap { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }
.act { font-weight: 600; text-decoration: none; border: 1px solid var(--accent); border-radius: 4px; padding: 1px 8px; }
.act:hover { background: var(--accent-wash); }
.path { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
.lnote { color: var(--muted); font-size: 11.5px; }
.lv { font-weight: 700; margin-right: 4px; white-space: nowrap; }
.lv.critical { color: var(--st-critical); }
.lv.serious { color: var(--st-serious); }
.lv.good { color: var(--ink-2); }
.rules { display: grid; gap: 12px; }
.rule { display: grid; grid-template-columns: 4px 1fr; gap: 0 14px; border: 1px solid var(--rule); border-radius: 4px; overflow: hidden; }
.rule .stripe { background: var(--sev); }
.rule .body { padding: 12px 14px 14px 0; display: grid; gap: 8px; min-width: 0; }
.rule .top { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.sev { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; }
.rule .fact { font-size: 14px; }
.rule .rec { font-size: 14px; }
.rule.off { opacity: 0.6; }
.rule.off .stripe { background: var(--rule-strong); }
.limits { display: grid; gap: 6px; padding-left: 18px; margin: 0; color: var(--ink-2); font-size: 13.5px; }
footer { margin-top: 40px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--muted); display: grid; gap: 4px; }
/* 설계 v3 틀 - 한 장 요약(인쇄하면 머리와 함께 첫 쪽)·깔때기·표본 적음·변경 표시선·같은 패턴 묶음·차단 뒤 재요청·관측 범위·정의 */
.sec-head .sub { font-size: 12.5px; color: var(--muted); }
.onepage .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.verdict { --vc: var(--rule-strong); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 18px; align-items: start;
  border: 1px solid var(--rule); border-left: 4px solid var(--vc); border-radius: 4px; padding: 12px 16px; word-break: keep-all; }
.verdict.lv0 { --vc: var(--st-good); } .verdict.lv1 { --vc: var(--st-warning); } .verdict.lv2 { --vc: var(--st-critical); }
.verdict .st { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 22px; font-weight: 700; line-height: 1.2; max-width: 7em; }
.verdict .st svg { width: 16px; height: 16px; flex: none; }
.verdict .vbody { display: grid; gap: 6px; min-width: 0; }
.lead { font-size: 15.5px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.chg { display: grid; gap: 2px; font-size: 13.5px; color: var(--ink-2); }
.chg ul { margin: 0; padding-left: 18px; }
.chg .k, .heads .k { font-size: 12px; font-weight: 600; color: var(--muted); }
.chg .s { font-size: 12px; color: var(--muted); }
.smallb { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--ink-2); border: 1px dashed var(--rule-strong);
  border-radius: 3px; padding: 0 4px; line-height: 1.5; white-space: nowrap; vertical-align: 1px; }
.flv { font-weight: 700; white-space: nowrap; }
.flv::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--fc, var(--rule-strong));
  margin-right: 6px; vertical-align: 1px; }
.flv.lv0 { --fc: var(--st-good); } .flv.lv1 { --fc: var(--st-warning); } .flv.lv2 { --fc: var(--st-critical); color: var(--st-critical-text); }
table.flags td:first-child { min-width: 9em; }
.heads { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.heads li { display: grid; grid-template-columns: 7em minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; font-size: 13.5px;
  word-break: keep-all; overflow-wrap: anywhere; border-top: 1px solid var(--rule); padding-top: 6px; }
.heads a { font-size: 12.5px; white-space: nowrap; }
.foot-rule { font-size: 11.5px; color: var(--muted); word-break: keep-all; overflow-wrap: anywhere; }
.part-label { margin: 36px 0 0; padding-top: 10px; border-top: 2px solid var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; color: var(--ink-2); }
.note.fl { color: var(--ink); font-weight: 500; word-break: keep-all; }
.chg-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 12.5px; color: var(--ink-2); word-break: keep-all; overflow-wrap: anywhere; }
.chg-list b { display: inline-block; min-width: 1.4em; color: var(--accent); }
.s-chg { --c: var(--accent); }
.ch .g-chg { stroke: var(--accent); stroke-width: 1; stroke-dasharray: 2 3; }
.ch .chg-n { fill: var(--accent); font-weight: 700; }
.inc.grp { border-left-width: 5px; }
.grp-ids { font-size: 13px; color: var(--ink-2); overflow-wrap: anywhere; }
details.grp-more summary { cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
details.grp-more .incs { margin-top: 8px; }
.bp { border: 1px solid var(--rule); border-left: 3px solid var(--s0); border-radius: 4px; padding: 12px 14px; display: grid; gap: 6px; min-width: 0; word-break: keep-all; }
.bp.passed { border-left-color: var(--st-critical); }
.bp:target { background: var(--accent-wash); }
.bp h3 { overflow-wrap: anywhere; }
.bp-line { font-size: 13.5px; }
.bp-acts { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; }
.bp-acts:empty { display: none; }
.bp .who { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 13px; }
table.cov .subrow { color: var(--ink-2); padding-left: 0.4em; }
table.cov td:nth-child(4) { min-width: 15em; }
table .na { color: var(--muted); }
.defs { display: grid; gap: 8px; }
.defs dl { margin: 0; display: grid; gap: 6px; }
.defs dl div { display: grid; grid-template-columns: 9.5em minmax(0, 1fr); gap: 2px 12px; font-size: 13px; word-break: keep-all; }
.defs dt { font-weight: 600; color: var(--ink-2); }
.defs dd { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
@media (max-width: 640px) {
  .v-wide { display: none; }
  .v-narrow { display: block; }
}
@media (max-width: 520px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpi .v { font-size: 24px; }
  .verdict { grid-template-columns: minmax(0, 1fr); } .verdict .st { max-width: none; }
  .heads li, .defs dl div { grid-template-columns: minmax(0, 1fr); } table.cov td:nth-child(4) { min-width: 11em; }
  table.flags td:first-child { min-width: 0; } table.flags th, table.flags td { padding-inline: 6px; }
  /* 관측 범위 표는 좁은 화면에서 줄마다 쌓는다: 항목 / 이번·이전 / 설명 */
  table.cov thead { display: none; }
  table.cov, table.cov tbody { display: block; }
  table.cov tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--rule); }
  table.cov td { display: block; border: 0; padding: 0; min-width: 0; }
  table.cov td:nth-child(1), table.cov td:nth-child(4) { grid-column: 1 / -1; }
  table.cov td:nth-child(4) { min-width: 0; font-size: 12.5px; color: var(--ink-2); }
  table.cov td:nth-child(2)::before { content: "이번 "; color: var(--muted); font-size: 12px; }
  table.cov td:nth-child(3)::before { content: "이전 "; color: var(--muted); font-size: 12px; } }
.legend i, .kpi .sw, .stripe, .flv::before, .verdict { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
@media print {
  @page { size: A4; margin: 14mm; }
  /* 어두운 화면 설정이어도 종이에는 흰 바탕·옅은 색 */
  :root, :root:not([data-theme="light"]), :root[data-theme="dark"] {
    --bg: #fff; --paper: #fff; --ink: #12161b; --ink-2: #4b5360; --muted: #6a717b; --rule: #e2e4e7; --rule-strong: #c7cbd1;
    --accent: #5b47b0; --accent-wash: rgba(91, 71, 176, 0.07);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s0: #d3d6db;
    --on-s0: #12161b; --on-s1: #ffffff; color-scheme: light;
  }
  body { background: #fff; padding: 0; font-size: 12.5px; }
  .doc { border: 0; padding: 0; max-width: none; }
  .toc { display: none; }
  .v-wide { display: block !important; }
  .v-narrow { display: none !important; }
  .chart, .fig, .kpi, .inc, .rule, .head { break-inside: avoid; page-break-inside: avoid; }
  h2, h3, .sec-head, .chart-title { break-after: avoid; page-break-after: avoid; }
  tr, .brief li { break-inside: avoid; }
  thead { display: table-header-group; }
  .act { border: 0; padding: 0; }
